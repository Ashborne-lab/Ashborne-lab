<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 236" width="850" height="236" role="img" aria-label="Shivam Kumar: building agents that remember; knowledge graphs and retrieval (RAG); learning in public, one PR at a time.">
<defs>
<linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="236"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111a30"/></linearGradient>
<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="470" y2="0"><stop offset="0" stop-color="#e8edf7"/><stop offset=".55" stop-color="#e8edf7"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
<linearGradient id="line" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="810" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
<filter id="soft" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5"/></filter>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.24em;fill:#2dd4bf}
.name{font-size:58px;font-weight:800;letter-spacing:-.02em;fill:url(#name);animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:16px}
.star{fill:#9fb0d0;animation:twinkle 5s ease-in-out infinite}
.line{transform-box:fill-box;transform-origin:left center;animation:draw 13.5s cubic-bezier(.6,0,.3,1) infinite}
.orb{animation:orb 13.5s cubic-bezier(.6,0,.3,1) infinite}
.ring{fill:none;transform-origin:728px 118px;animation:spin linear infinite}
.pulse{transform-origin:728px 118px;animation:pulse 3s ease-in-out infinite}
.tag{opacity:0;animation-duration:13.5s;animation-iteration-count:infinite;animation-fill-mode:backwards}
.curtain{animation-duration:13.5s;animation-iteration-count:infinite;animation-fill-mode:backwards}
.caret{fill:#2dd4bf;animation:blink .9s steps(1) infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@keyframes draw{0%{transform:scaleX(0);opacity:1}16%,92%{transform:scaleX(1);opacity:1}98%,100%{transform:scaleX(1);opacity:0}}
@keyframes orb{0%{transform:translateX(0);opacity:1}16%{transform:translateX(580px);opacity:1}19%,100%{transform:translateX(580px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.25);opacity:.15}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes show{0%{opacity:0}.4%,32.6%{opacity:1}33.3%,100%{opacity:0}}
@keyframes type0{0%{transform:translateX(0);animation-timing-function:steps(29)}11%,26%{transform:translateX(278.4px);animation-timing-function:steps(29)}31%,100%{transform:translateX(0)}}
@keyframes type1{0%{transform:translateX(0);animation-timing-function:steps(36)}11%,26%{transform:translateX(345.6px);animation-timing-function:steps(36)}31%,100%{transform:translateX(0)}}
@keyframes type2{0%{transform:translateX(0);animation-timing-function:steps(36)}11%,26%{transform:translateX(345.6px);animation-timing-function:steps(36)}31%,100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.orb,.curtain,.t1,.t2{display:none}.t0{opacity:1}}
</style>
<rect x=".5" y=".5" width="849" height="235" rx="16" fill="url(#bg)" stroke="#232c44"/>
