<text class="eyebrow" x="40" y="66">HELLO, I'M</text>
<text class="name" x="40" y="128">Shivam Kumar</text>
<rect class="line" x="40" y="151" width="580" height="2" rx="1" fill="url(#line)"/>
<g class="orb"><circle cx="40" cy="152" r="9" fill="#fbbf24" filter="url(#soft)"/><circle cx="40" cy="152" r="3.4" fill="#ffffff"/></g>
<text class="mono" x="40" y="194" fill="#2dd4bf">&gt;</text>
<g class="tag t0" style="animation-name:show;animation-delay:0.00s"><text class="mono" x="62" y="194" textLength="278.4" lengthAdjust="spacing" fill="#e8edf7">building agents that remember</text><g class="curtain" style="animation-name:type0;animation-delay:0.00s"><rect x="62" y="176" width="292.4" height="28" fill="url(#bg)"/><rect class="caret" x="64" y="180" width="8" height="18" rx="1"/></g></g>
<g class="tag t1" style="animation-name:show;animation-delay:4.50s"><text class="mono" x="62" y="194" textLength="345.6" lengthAdjust="spacing" fill="#e8edf7">knowledge graphs and retrieval (RAG)</text><g class="curtain" style="animation-name:type1;animation-delay:4.50s"><rect x="62" y="176" width="359.6" height="28" fill="url(#bg)"/><rect class="caret" x="64" y="180" width="8" height="18" rx="1"/></g></g>
<g class="tag t2" style="animation-name:show;animation-delay:9.00s"><text class="mono" x="62" y="194" textLength="345.6" lengthAdjust="spacing" fill="#e8edf7">learning in public, one PR at a time</text><g class="curtain" style="animation-name:type2;animation-delay:9.00s"><rect x="62" y="176" width="359.6" height="28" fill="url(#bg)"/><rect class="caret" x="64" y="180" width="8" height="18" rx="1"/></g></g>
